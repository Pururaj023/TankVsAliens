name: Build & Deploy Tank Game

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: prod

    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:

    # 1. Checkout with push capability
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0

    # 2. Docker Login
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Build Image
    - name: Build Image
      run: |
        docker build -t $DOCKER_USERNAME/$IMAGE_NAME:${{ github.sha }} \
                     -t $DOCKER_USERNAME/$IMAGE_NAME:latest \
                     ./tank-vs-aliens

    # 4. Push Image
    - name: Push Image
      run: |
        docker push $DOCKER_USERNAME/$IMAGE_NAME:${{ github.sha }}
        docker push $DOCKER_USERNAME/$IMAGE_NAME:latest

    # 5. Update image tag (ROBUST - works every time)
    - name: Update deployment.yaml image tag
      run: |
        sed -i "s|$DOCKER_USERNAME/$IMAGE_NAME:.*|$DOCKER_USERNAME/$IMAGE_NAME:${{ github.sha }}|g" tank-vs-aliens/k8s/deployment.yaml

    # 6. Verify change (optional but useful)
    - name: Verify file
      run: cat tank-vs-aliens/k8s/deployment.yaml

    # 7. Commit & push
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add tank-vs-aliens/k8s/deployment.yaml
        git commit -m "Update image tag to ${{ github.sha }}" || echo "No changes"
        git push origin main
