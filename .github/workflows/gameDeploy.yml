name: Build & Deploy Tank Game

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: prod

    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:

    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v4


    # 2. Docker Login (from Environment Secrets)
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Build Docker Image with commit SHA
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${{ github.sha }} ./tank-vs-aliens

    # 4. Push Docker Image
    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${{ github.sha }}

     # 5. Deploy to EC2 via SSH
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}

        envs: IMAGE_NAME,DOCKER_USERNAME,DOCKER_PASSWORD,GITHUB_SHA

        script: |
          docker pull $DOCKER_USERNAME/$IMAGE_NAME:$GITHUB_SHA

          docker stop tank-game || true
          docker rm tank-game || true

          docker run -d \
            -p 80:80 \
            --name tank-game \
            --restart always \
            $DOCKER_USERNAME/$IMAGE_NAME:$GITHUB_SHA
