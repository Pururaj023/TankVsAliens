name: Build & Deploy Tank Game

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: prod

    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}

    steps:

    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v4


    # 2. Docker Login (from Environment Secrets)
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Build Docker Image with commit SHA
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${{ github.sha }} ./tank-vs-aliens

    # 4. Push Docker Image
    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${{ github.sha }}
