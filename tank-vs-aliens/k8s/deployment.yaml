apiVersion: apps/v1
kind: Deployment
metadata:
  name: tank-game
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tank-game
  template:
    metadata:
      labels:
        app: tank-game
    spec:
      containers:
      - name: tank-game-container
        image: pururajchoudhary23/tankvsalien:44bb4d0a0476b9730ac20d114f8eb96c91f80463
        ports:
        - containerPort: 80
